name: build

on:
  push:
  pull_request:

permissions:
  contents: write  # publish the "latest" release

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Test
        run: dotnet test tests/AiO.Core.Tests -c Release
      - name: Publish
        run: dotnet publish src/AiO.App -c Release -o publish -p:SourceRevisionId=${{ github.sha }}
      - name: Include the mouse acceleration driver (RawAccel, MIT)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo a1xd/rawaccel --pattern "*.zip" --dir rawaccel
          $zip = Get-ChildItem rawaccel/*.zip | Select-Object -First 1
          Expand-Archive $zip.FullName -DestinationPath rawaccel/x
          $writer = Get-ChildItem rawaccel/x -Recurse -Filter writer.exe | Select-Object -First 1
          if (-not $writer) { throw "writer.exe not found in $($zip.Name)" }
          Copy-Item $writer.DirectoryName -Destination publish/RawAccel -Recurse
          Get-ChildItem publish/RawAccel -Recurse | Select-Object -ExpandProperty FullName
      - name: Include PawnIO's RyzenSMU module (LGPL-2.1, for the Danger zone undervolt)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Signed module from https://github.com/namazso/PawnIO.Modules releases. The PawnIO driver itself
          # is installed by the user from https://pawnio.eu. A missing module only disables undervolting.
          try {
            gh release download --repo namazso/PawnIO.Modules --pattern "*" --dir pawnio
            if ($LASTEXITCODE -ne 0) { throw "gh release download failed" }
            Get-ChildItem pawnio -Filter *.zip | ForEach-Object { Expand-Archive $_.FullName -DestinationPath pawnio/x -Force }
            $module = Get-ChildItem pawnio -Recurse -Filter RyzenSMU.bin | Select-Object -First 1
            if (-not $module) { throw "RyzenSMU.bin not found in the release" }
            New-Item -ItemType Directory -Force publish/PawnIO | Out-Null
            Copy-Item $module.FullName publish/PawnIO/RyzenSMU.bin
            Get-ChildItem pawnio -Recurse -Filter COPYING* | Select-Object -First 1 | Copy-Item -Destination publish/PawnIO/COPYING.txt
            Get-ChildItem publish/PawnIO
          } catch {
            Write-Warning "PawnIO module not included: $_"
          }
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: AiO-win-x64
          path: publish
      - name: Publish the "latest" release
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          Compress-Archive -Path publish/* -DestinationPath AiO-win-x64.zip
          gh release delete latest --yes --cleanup-tag 2>$null
          $global:LASTEXITCODE = 0
          gh release create latest AiO-win-x64.zip --target $env:GITHUB_SHA --title "AiO (latest build)" --notes "Built from $env:GITHUB_SHA. Unzip and run AiO.exe. Needs the .NET 8 Desktop Runtime."
